

<app-product-list
  [products]="productsService.products()"
  (edit)="openEdit($event)">
</app-product-list>

<app-product-form-modal
  [open]="isModalOpen"
  [product]="selectedProduct"
  (save)="save($event)"
  (close)="closeModal()">
</app-product-form-modal>

<button
  class="bg-blue-500 text-white px-4 py-2 rounded mb-4"
  (click)="openCreate()">
  + Add Product
</button>
