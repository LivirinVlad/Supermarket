<div class="p-6">

  <h1 class="text-2xl font-bold mb-6">Products</h1>

  <div class="grid gap-4">

    <div *ngFor="let p of products"
         class="p-4 border rounded-xl shadow flex justify-between">

      <div>
        <h2 class="text-lg font-semibold">{{ p.name }}</h2>
        <p class="text-gray-500">{{ p.description }}</p>

        <div class="mt-2 text-sm">
          <span class="font-bold">Price:</span> {{ p.price }}$
        </div>

        <div class="text-sm">
          <span class="font-bold">Stock:</span> {{ p.stock }}
        </div>
      </div>

      <div class="flex gap-2">

        <button
          class="bg-red-500 text-white px-3 py-1 rounded"
          (click)="sell(p.id)">
          Sell
        </button>

        <button
          class="bg-green-500 text-white px-3 py-1 rounded"
          (click)="add(p.id)">
          Add
        </button>

      </div>

    </div>

  </div>
</div>
