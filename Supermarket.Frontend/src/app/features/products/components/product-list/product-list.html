<table class="w-full text-left">
  <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Active</th>
    </tr>
  </thead>

  <tbody>
  @for (p of products; track p.id) {
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>{{ p.stockQuantity }}</td>
      <td>{{ p.isActive ? 'Yes' : 'No' }}</td>

      <td>
        <button (click)="edit.emit(p)">
          Edit
        </button>
      </td>
    </tr>
  }
</tbody>

</table>
