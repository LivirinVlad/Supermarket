<table class="w-full text-left">
  <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Stock</th>

    </tr>
  </thead>

  <tbody>
  @for (p of products; track p.id) {
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>{{ p.stock }}</td>

      <td>
        <button (click)="edit.emit(p)">
          Edit
        </button>
<button
    class="ml-2 bg-gray-200 px-2 py-1 rounded"
    (click)="stock.emit(p)">
    Stock
  </button>
      </td>
    </tr>
  }
</tbody>

</table>
